<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0646b9"><meta name="description" content="Neon Dash 3D: um jogo de plataforma neon com pulos e obstáculos."><title>Neon Dash 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0639a0;color:white;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none;padding:15px;display:flex;flex-direction:column;justify-content:space-between}.top{display:flex;justify-content:space-between;align-items:flex-start}.logo{font-size:clamp(13px,3.4vw,19px);font-weight:1000;letter-spacing:.07em;color:#baff38;text-shadow:2px 3px #173d0c,-2px -2px #f1ff7c,0 0 15px #83ff00;line-height:1.1}.pill{background:#071b54dd;border:2px solid #56f4ff;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:900;box-shadow:0 0 12px #00eaff55}#progress{position:absolute;left:16px;right:16px;top:56px;height:6px;background:#07174788;border:1px solid #7cfaff;border-radius:9px;overflow:hidden}#bar{height:100%;width:0;background:linear-gradient(90deg,#00eaff,#adff29);box-shadow:0 0 10px #00eaff}#hint{align-self:center;margin-bottom:10px;background:#041c59dd;border:1px solid #83f8ff;border-radius:20px;padding:9px 15px;text-align:center;font-size:12px;color:#edffff;box-shadow:0 0 17px #00eaff55}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#031744a8;backdrop-filter:blur(3px);padding:18px}.panel{width:min(430px,100%);text-align:center;padding:27px 22px;background:linear-gradient(145deg,#0755cdee,#071946f5);border:2px solid #75f8ff;border-radius:21px;box-shadow:0 0 45px #00d9ff55}.panel h1{font-size:clamp(30px,10vw,54px);font-weight:1000;letter-spacing:.025em;line-height:.96;margin:0 0 12px;color:#baff38;-webkit-text-stroke:1px #f3ffb2;text-shadow:3px 4px #234d08,0 0 18px #94ff00}.panel p{color:#e5f5ff;line-height:1.5}.btn{pointer-events:auto;border:2px solid #d7ff77;border-radius:12px;background:linear-gradient(#baff38,#56d923);color:#09275b;font-weight:1000;font-size:17px;padding:12px 25px;cursor:pointer;box-shadow:0 4px #287a19,0 0 20px #b4ff3a77}.small{font-size:12px!important;color:#d0eaff!important}.hidden{display:none!important}
</style></head><body><canvas id="game"></canvas><div id="hud"><div class="top"><div class="logo">GEOMETRY<br>DASH 3D</div><div class="pill">◆ <span id="score">0</span></div></div><div id="progress"><div id="bar"></div></div><div id="hint">Toque / clique / <b>ESPAÇO</b> para pular</div></div><div class="overlay" id="start"><div class="panel"><h1>GEOMETRY<br>DASH 3D</h1><p>Pule no ritmo, desvie dos espinhos e alcance o portal neon!</p><button class="btn" id="play">JOGAR</button><p class="small">Toque na tela ou use ESPAÇO / ↑</p></div></div><div class="overlay hidden" id="end"><div class="panel"><h1 id="endtitle">OPS!</h1><p id="endtext"></p><button class="btn" id="again">TENTAR DE NOVO</button></div></div>
<script>
(()=>{const c=document.getElementById('game'),x=c.getContext('2d');let W,H,D;function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
const start=document.getElementById('start'),end=document.getElementById('end'),scoreNode=document.getElementById('score'),bar=document.getElementById('bar');let active=false,dead=false,win=false,clock=0,prev=0,travel=0,score=0,vy=0,air=0,lastJump=-1,particles=[],soundCtx;const duration=4050,baseY=()=>H*.77,unit=()=>Math.max(27,Math.min(42,W*.083));
function tone(f=480,d=.09,w='square'){try{soundCtx=soundCtx||new(window.AudioContext||window.webkitAudioContext)();let o=soundCtx.createOscillator(),g=soundCtx.createGain();o.type=w;o.frequency.value=f;g.gain.setValueAtTime(.04,soundCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,soundCtx.currentTime+d);o.connect(g);g.connect(soundCtx.destination);o.start();o.stop(soundCtx.currentTime+d)}catch(e){}}
function reset(){active=true;dead=win=false;clock=travel=score=air=vy=0;lastJump=-1;particles=[];start.classList.add('hidden');end.classList.add('hidden');prev=performance.now();requestAnimationFrame(frame)}function jump(){if(!active){if(!dead&&!win)reset();return}const now=performance.now();if(now-lastJump<75)return;lastJump=now;vy=Math.max(510,Math.min(700,H*.82));tone(680,.055)}document.getElementById('play').onclick=()=>{tone();reset()};document.getElementById('again').onclick=()=>{tone();reset()};c.addEventListener('pointerdown',e=>{e.preventDefault();jump()});addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();jump()}if(e.code==='Enter'&&(dead||win))reset()});
function poly(points,fill,stroke,lw=2){x.beginPath();points.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.fillStyle=fill;x.fill();if(stroke){x.strokeStyle=stroke;x.lineWidth=lw;x.stroke()}}
function background(){let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#0638a1');sky.addColorStop(.55,'#0861ce');sky.addColorStop(1,'#087ee2');x.fillStyle=sky;x.fillRect(0,0,W,H);let tile= Math.max(54,Math.min(100,W*.18));let ox=-(travel*.22%tile);for(let row=0;row<5;row++){let yy=H*.08+row*tile;for(let col=-1;col<W/tile+2;col++){let xx=ox+col*tile+(row%2)*tile*.5;x.fillStyle=(row+col)%2?'#0b50b4':'#0846aa';x.fillRect(xx,yy,tile-3,tile-3);x.strokeStyle='#1685e8aa';x.lineWidth=2;x.strokeRect(xx+7,yy+7,tile-17,tile-17)}}
// luminous geometric ribbons and decorative dots
x.globalAlpha=.24;x.strokeStyle='#22c9ff';x.lineWidth=5;x.beginPath();x.moveTo(0,H*.32);x.bezierCurveTo(W*.23,H*.22,W*.54,H*.4,W,H*.26);x.stroke();x.globalAlpha=1;for(let i=0;i<28;i++){let xx=(i*71-travel*.7)%(W+25);if(xx<0)xx+=W;let yy=H*.69+(i%4)*8;x.fillStyle=i%2?'#00eaff':'#b6ff30';x.globalAlpha=.6;x.fillRect(xx,yy,3,3)}x.globalAlpha=1;
// back plane gives a little depth
let gy=baseY();x.fillStyle='#092e83';x.fillRect(0,gy,W,H-gy);x.fillStyle='#061f65';x.fillRect(0,gy+unit()*.25,W,H-gy);x.fillStyle='#20eaff';x.shadowColor='#00edff';x.shadowBlur=12;x.fillRect(0,gy-3,W,4);x.shadowBlur=0;let cell=unit()*1.6,shift=travel%cell;x.strokeStyle='#1575cf99';x.lineWidth=1;for(let xx=-shift;xx<W;xx+=cell){x.beginPath();x.moveTo(xx,gy+3);x.lineTo(xx+14,H);x.stroke()} }
function cube(px,py,s,fill,edge){x.save();x.shadowColor=edge;x.shadowBlur=17;x.fillStyle=fill;x.fillRect(px,py,s,s);x.shadowBlur=0;x.strokeStyle='#e2ffff';x.lineWidth=2.3;x.strokeRect(px+1,py+1,s-2,s-2);x.fillStyle='#102b70';x.fillRect(px+s*.2,py+s*.24,s*.17,s*.18);x.fillRect(px+s*.63,py+s*.24,s*.17,s*.18);x.fillStyle='#ffea40';x.fillRect(px+s*.33,py+s*.65,s*.35,s*.08);x.restore()}
function spike(px,gy,s,color='#06f6ff'){x.save();x.shadowColor=color;x.shadowBlur=13;poly([[px,gy],[px+s*.5,gy-s],[px+s,gy]],'#08163f','#f4ffff',2);poly([[px+s*.37,gy-s*.27],[px+s*.5,gy-s*.86],[px+s*.64,gy-s*.25]],color);x.restore()}
const course=[{at:205,type:'spike'},{at:240,type:'spike'},{at:280,type:'block'},{at:410,type:'spike'},{at:452,type:'block'},{at:580,type:'spike'},{at:620,type:'spike'},{at:665,type:'spike'},{at:715,type:'block'},{at:850,type:'spike'},{at:890,type:'block'},{at:1010,type:'spike'},{at:1050,type:'spike'}];
function obstacle(item){let px=W+unit()*2+item.at*3-travel, gy=baseY(),s=unit();if(px<-s*2||px>W+s*2)return;if(item.type==='spike')spike(px,gy,s);else{let py=gy-s*.88;x.save();x.shadowColor='#050b24';x.shadowBlur=8;x.fillStyle='#080c25';x.fillRect(px,py,s,gy-py);x.shadowBlur=0;x.strokeStyle='#00f5ff';x.lineWidth=2.5;x.strokeRect(px+1,py+1,s-2,gy-py-1);x.restore()}}
function portal(){if(travel<duration-130)return;let xx=W+unit()*3+duration-travel,cy=baseY()-unit()*.8,r=unit()*.75;if(xx<-r*2||xx>W+r*2)return;x.save();x.translate(xx,cy);x.shadowColor='#fa36ff';x.shadowBlur=25;x.strokeStyle='#ff5cf3';x.lineWidth=7;x.beginPath();x.ellipse(0,0,r*.63,r*1.18,.12,0,Math.PI*2);x.stroke();x.shadowBlur=0;x.strokeStyle='#aefbff';x.lineWidth=2;x.beginPath();x.ellipse(0,0,r*.43,r*.99,.12,0,Math.PI*2);x.stroke();x.restore()}
function drawHero(){let s=unit()*.83,px=W*.24,gy=baseY(),py=gy-s-air;x.save();x.translate(px+s/2,py+s/2);x.rotate(Math.min(air/s*.45,.8));cube(-s/2,-s/2,s,'#fa39dc','#ff49ec');x.restore();x.globalAlpha=Math.max(.12,.38-air/220);x.fillStyle='#00f6ff';x.beginPath();x.ellipse(px+s/2,gy+3,s*.44,5,0,0,Math.PI*2);x.fill();x.globalAlpha=1}
function burst(){for(let i=0;i<30;i++)particles.push({px:W*.24+unit()*.4,py:baseY()-unit(),vx:(Math.random()-.5)*450,vy:(Math.random()-.7)*500,t:1,color:i%2?'#fd42ea':'#40fcff'})}function drawParticles(dt){particles=particles.filter(p=>p.t>0);for(let p of particles){p.px+=p.vx*dt;p.py+=p.vy*dt;p.vy+=450*dt;p.t-=dt*1.5;x.globalAlpha=Math.max(0,p.t);x.fillStyle=p.color;x.fillRect(p.px,p.py,5,5)}x.globalAlpha=1}
function finish(success){active=false;win=success;dead=!success;if(!success)burst();setTimeout(()=>{document.getElementById('endtitle').textContent=success?'FASE COMPLETA!':'OPS!';document.getElementById('endtext').textContent=success?`Você chegou ao portal com ${score} pontos!`:`Pontuação: ${score}. Tente de novo e pule no momento certo!`;end.classList.remove('hidden')},success?250:450);tone(success?900:145,.32,success?'sine':'sawtooth')}
function frame(now){if(!active)return;let dt=Math.min(.035,(now-prev)/1000||.016);prev=now;clock+=dt;travel+=dt*230;score=Math.floor(travel/3);air=Math.max(0,air+vy*dt);if(air===0)vy=0;else vy-=1450*dt;let s=unit(),px=W*.24,gy=baseY();for(let o of course){let ox=W+s*2+o.at*3-travel;if(ox>px-s*.5&&ox<px+s*.78&&air<s*.58){finish(false);break}}if(travel>=duration)finish(true);background();for(let o of course)obstacle(o);portal();drawHero();drawParticles(dt);scoreNode.textContent=score;bar.style.width=Math.min(100,travel/duration*100)+'%';if(active)requestAnimationFrame(frame)}background();})();
</script></body></html>
