<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#08091c">
<title>Neon Dash 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08091c;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none;padding:18px;display:flex;flex-direction:column;justify-content:space-between}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.brand{font-weight:900;letter-spacing:.12em;font-size:clamp(14px,3vw,20px);color:#b7faff;text-shadow:0 0 15px #00e5ff}.stats{display:flex;gap:8px}.pill{background:#10172fcc;border:1px solid #5bf4ff66;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;backdrop-filter:blur(8px)}#progress{position:absolute;left:18px;right:18px;top:62px;height:6px;background:#ffffff20;border-radius:9px;overflow:hidden}#bar{height:100%;width:0;background:linear-gradient(90deg,#00e5ff,#c450ff);box-shadow:0 0 14px #00e5ff}#hint{align-self:center;margin-bottom:14px;background:#08091ccf;border:1px solid #8cfaff55;border-radius:18px;padding:11px 17px;text-align:center;font-size:13px;color:#e9fcff;box-shadow:0 0 24px #00d9ff20}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#050616a8;backdrop-filter:blur(5px);padding:20px}.panel{width:min(470px,100%);text-align:center;padding:30px 24px;background:linear-gradient(145deg,#151b3bed,#0c1031f2);border:1px solid #54f5ff70;border-radius:25px;box-shadow:0 0 70px #2adcf533}.panel h1{font-size:clamp(30px,9vw,54px);margin:0 0 5px;line-height:1;color:#b6fbff;text-shadow:0 0 20px #00d9ff}.panel p{color:#d4dcf8;line-height:1.55}.btn{pointer-events:auto;border:0;border-radius:14px;background:linear-gradient(100deg,#00d9ff,#a73cff);color:#071020;font-weight:900;font-size:17px;padding:14px 26px;cursor:pointer;box-shadow:0 0 25px #00d9ff55}.small{font-size:12px!important;color:#aeb9dc!important}.hidden{display:none!important}@media(max-width:550px){#hud{padding:13px}.pill{padding:7px 9px;font-size:12px}#progress{left:13px;right:13px;top:55px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="top"><div class="brand">◆ NEON DASH 3D</div><div class="stats"><div class="pill">◆ <span id="score">0</span></div><div class="pill">FASE <span id="level">1</span></div></div></div><div id="progress"><div id="bar"></div></div><div id="hint">Toque, clique ou aperte <b>ESPAÇO</b> para pular</div></div>
<div class="overlay" id="start"><div class="panel"><h1>NEON<br>DASH 3D</h1><p>Corra pelo mundo neon, desvie dos espinhos e chegue ao portal!</p><button class="btn" id="play">JOGAR</button><p class="small">Toque na tela ou use ESPAÇO / ↑ para pular</p></div></div>
<div class="overlay hidden" id="end"><div class="panel"><h1 id="endtitle">OPS!</h1><p id="endtext">Você bateu em um obstáculo.</p><button class="btn" id="again">TENTAR DE NOVO</button></div></div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),levelEl=document.getElementById('level'),start=document.getElementById('start'),end=document.getElementById('end');
let running=false,dead=false,won=false,last=0,t=0,dist=0,speed=10,score=0,jump=0,jv=0,flash=0,obstacles=[],particles=[],audio=null;
const finish=950, horizon=.38;
function newGame(){running=true;dead=false;won=false;t=0;dist=0;speed=10;score=0;jump=0;jv=0;flash=0;obstacles=[];particles=[];for(let i=0;i<76;i++)obstacles.push({z:26+i*12,type:(i%5===2||i%7===4)?'block':'spike',lane:0});start.classList.add('hidden');end.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
function sound(freq=500,dur=.09,type='sine'){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function jumpNow(){if(!running||dead||won)return;if(jump<=0){jv=13.5;sound(620,.11,'square')}}
document.getElementById('play').onclick=()=>{sound(480);newGame()};document.getElementById('again').onclick=()=>{sound(480);newGame()};canvas.addEventListener('pointerdown',e=>{e.preventDefault();jumpNow()});addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!running&&!dead&&!won)newGame();else jumpNow()}if(e.code==='Enter'&&(dead||won))newGame()});
function project(x,y,z){let horizonY=H*horizon, focal=H*.85, zz=Math.max(.2,z),scale=focal/(zz+4);return {x:W/2+x*scale,y:horizonY+(y*scale),s:scale}}
function polygon(points,fill,stroke=null,lw=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function line(a,b,color,width=1){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function drawBackground(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#07091c');g.addColorStop(.56,'#17113d');g.addColorStop(1,'#241041');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
// stars
for(let i=0;i<70;i++){let x=(i*193.7%W),y=(i*97.3%(H*.48));ctx.globalAlpha=.25+.55*(.5+.5*Math.sin(t*2+i));ctx.fillStyle=i%3?'#b9faff':'#ff74ed';ctx.fillRect(x,y,1.5,1.5)}ctx.globalAlpha=1;
// distant skyline
let base=H*horizon+7;for(let i=0;i<18;i++){let bw=W/12+20,bx=(i*W/9-(dist*.14)%(W/9))-15,bh=H*(.08+(i*37%100)/600);ctx.fillStyle=i%2?'#111637':'#17143b';ctx.fillRect(bx,base-bh,bw,bh);ctx.fillStyle='#40eaff66';for(let yy=base-bh+8;yy<base-3;yy+=13)for(let xx=bx+7;xx<bx+bw-5;xx+=13)if((xx+yy+i)%4<2)ctx.fillRect(xx,yy,3,4)}
// track plane
let l=project(-7,0,0),r=project(7,0,0),lf=project(-7,0,90),rf=project(7,0,90);polygon([l,r,rf,lf],'#0b102b');
// perspective lane lines
for(let x of [-3.5,0,3.5]){line(project(x,0,.1),project(x,0,100),'#36e6ff33',1)}
// grid transverse lines
for(let k=0;k<22;k++){let z=((k*5.2-(dist%5.2))+5.2)%110+2;let a=project(-7,0,z),b=project(7,0,z);line(a,b,`rgba(32,220,255,${.1+Math.max(0,1-z/110)*.25})`,Math.max(1,project(0,0,z).s*.018))}
// track edges
line(project(-7,0,1),project(-7,0,100),'#03eaff99',2);line(project(7,0,1),project(7,0,100),'#f849ff88',2);
}
function drawCube(x,z,size,color){let b=project(x,0,z),top=project(x,size,z),left=project(x-size*.5,size,z),right=project(x+size*.5,size,z),front=project(x,0,z-1.2);let s=Math.max(2,b.s*size*.48);ctx.save();ctx.shadowBlur=s*.35;ctx.shadowColor=color;polygon([{x:b.x-s/2,y:b.y},{x:b.x+s/2,y:b.y},{x:b.x+s/2,y:top.y},{x:b.x-s/2,y:top.y}],color);ctx.shadowBlur=0;ctx.strokeStyle='#ffffffaa';ctx.lineWidth=Math.max(1,s*.04);ctx.strokeRect(b.x-s/2,top.y,s,s);polygon([{x:b.x+s/2,y:b.y},{x:b.x+s*.78,y:b.y-s*.18},{x:b.x+s*.78,y:top.y-s*.18},{x:b.x+s/2,y:top.y}],color==='#fa3cff'?'#9823b0':'#138aaa');polygon([{x:b.x-s/2,y:top.y},{x:b.x-s*.22,y:top.y-s*.18},{x:b.x+s*.78,y:top.y-s*.18},{x:b.x+s/2,y:top.y}],color==='#fa3cff'?'#ff82f5':'#70f8ff');ctx.restore()}
function drawSpike(o){let p=project(0,0,o.z),s=p.s;let w=s*1.05,h=s*1.15;ctx.save();ctx.shadowColor='#ff4dec';ctx.shadowBlur=s*.3;polygon([{x:p.x-w/2,y:p.y},{x:p.x,y:p.y-h},{x:p.x+w/2,y:p.y}],'#fc38dd','#ffd4ff',Math.max(1,s*.045));polygon([{x:p.x-w*.22,y:p.y},{x:p.x,y:p.y-h*.62},{x:p.x+w*.12,y:p.y}],'#ff9cf5');ctx.restore()}
function drawPlayer(){let p=project(0,0,3.5),s=Math.max(16,p.s*1.22),lift=jump;let y=p.y-s*.7-lift*13;ctx.save();ctx.shadowColor='#00efff';ctx.shadowBlur=22;let rot=Math.min(.25,jump*.018);ctx.translate(p.x,y);ctx.rotate(rot);ctx.fillStyle='#13dff5';ctx.fillRect(-s/2,-s/2,s,s);ctx.shadowBlur=0;ctx.strokeStyle='#d4ffff';ctx.lineWidth=2;ctx.strokeRect(-s/2,-s/2,s,s);ctx.fillStyle='#08132f';ctx.fillRect(-s*.27,-s*.16,s*.15,s*.15);ctx.fillRect(s*.12,-s*.16,s*.15,s*.15);ctx.fillStyle='#ff58ef';ctx.fillRect(-s*.17,s*.17,s*.34,s*.08);ctx.restore();let sh=project(0,0,3.5);ctx.globalAlpha=Math.max(.12,.35-jump*.025);ctx.fillStyle='#00f6ff';ctx.beginPath();ctx.ellipse(sh.x,sh.y+2,s*.42,s*.12,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
function burst(){let p=project(0,0,3.5);for(let i=0;i<28;i++)particles.push({x:p.x,y:p.y-20,vx:(Math.random()-.5)*7,vy:(Math.random()-.7)*8,life:1,color:i%2?'#00eaff':'#ff46ed'})}
function drawParticles(dt){particles=particles.filter(p=>p.life>0);for(let p of particles){p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vy+=.15;p.life-=dt*1.4;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,5,5)}ctx.globalAlpha=1}
function finishGame(win){running=false;won=win;dead=!win;if(!win)burst();setTimeout(()=>{document.getElementById('endtitle').textContent=win?'FASE COMPLETA!':'OPS!';document.getElementById('endtext').textContent=win?`Você chegou ao portal com ${score} pontos!`:`Pontuação: ${score}. Tente pular no momento certo!`;end.classList.remove('hidden')},win?250:350);sound(win?880:150,.35,win?'sine':'sawtooth')}
function loop(now){if(!running)return;let dt=Math.min(.04,(now-last)/1000||.016);last=now;t+=dt;dist+=speed*dt;score=Math.floor(dist/2);speed=Math.min(17,10+dist*.004);jump=Math.max(0,jump+jv*dt);if(jump===0)jv=0;else jv-=34*dt;
for(const o of obstacles){o.z-=speed*dt;if(o.z<4.5&&o.z>2.2&&jump<(o.type==='block'?1.0:1.2)){finishGame(false);break}}
if(dist>=finish)finishGame(true);drawBackground();for(let o of [...obstacles].reverse()){if(o.z>0&&o.z<110){if(o.type==='spike')drawSpike(o);else drawCube(0,o.z,2.6,'#fa3cff')}}drawPlayer();drawParticles(dt);scoreEl.textContent=score;levelEl.textContent=dist<finish/2?'1':'2';bar.style.width=Math.min(100,dist/finish*100)+'%';if(running)requestAnimationFrame(loop)}
})();
</script></body></html>
